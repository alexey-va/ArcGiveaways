name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .codex/**
      - src/test/e2e/**
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - .agents/**
      - .codex/**
      - src/test/e2e/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: alexey-va/arc-core/.github/actions/verify-consumer@cd6968209a40ad80841b14cf434a234edc08922d
      - run: ./gradlew --no-daemon test shadowJar --build-cache
      - name: Retain production plugin JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcGiveaways-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/libs/ArcGiveaways-*.jar
            !build/libs/*-plain.jar

  integration:
    name: Storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify Docker daemon
        run: docker info
      - run: ./gradlew --no-daemon integrationTest

  e2e:
    name: Real Paper E2E (Plugwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        ports: ["6380:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=12
    env: { TEST_TIMEOUT: "90000" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexey-va/ARC
          ref: 560ccd424d82c0c5e3c70daeb1ddc8c47837c90a
          path: e2e-arc
      - name: Download immutable ArcCore provider
        run: |
          mkdir -p build/e2e-runtime
          curl --fail --location --retry 3 --output build/e2e-runtime/ArcCore-0.1.12.jar https://repo.rus-crafting.ru/grocermc/ru/ruscrafting/ArcCore/0.1.12/ArcCore-0.1.12.jar
          echo '93158072f30ad3d7d5201acdf9036324841c4455844b4f1b650cfea0d8540502  build/e2e-runtime/ArcCore-0.1.12.jar' | sha256sum --check --strict
      - name: Build ARC provider dependency
        run: ./gradlew --no-daemon shadowJar
        working-directory: e2e-arc
      - name: Run ArcGiveaways on real Paper
        run: |
          set -o pipefail
          mkdir -p build
          mapfile -t arc_jars < <(find e2e-arc/build/libs -maxdepth 1 -type f -name 'ARC-*.jar' ! -name '*-plain.jar' -print | sort)
          test "${#arc_jars[@]}" -eq 1
          ./gradlew --no-daemon plugwrightTest "-Pe2eArcJar=${arc_jars[0]}" -Pe2eArcCoreJar=build/e2e-runtime/ArcCore-0.1.12.jar 2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
      - name: Upload Paper E2E logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcgiveaways-paper-e2e
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/plugwright/logs/
            build/plugwright/crash-reports/
