server-id: spawn

giveaway:
  radius-blocks: 100.0
  open-seconds: 45
  drawing-seconds: 6
  minimum-participants: 1
  maximum-participants: 250
  maximum-item-amount: 64
  host-cooldown-seconds: 0
  terminal-retention-minutes: 30

cross-server:
  enabled: true
  transfer-on-click: true
  pending-join-seconds: 45
  host-handoff-seconds: 45
  presence-heartbeat-seconds: 5
  presence-lease-seconds: 20
  allowed-origins: [spawn, survival, parkour]

redis:
  import-arc-credentials: true

effects:
  bossbar: true
  actionbar: true
  titles: true
  sounds: true
  # Master switches for every world-space scene below.
  particles: true
  fireworks: true
  # One safe master dial for particle density and firework cadence/count.
  # 1.0 is the full show; lower it to reduce load and visual noise.
  intensity: 1.0
  glow:
    enabled: true
    host: true
    participants: true
  firework-style:
    # Vanilla firework flight power. Keep this small so the show stays near the giveaway.
    power: 1
    colors: ['#ff6b00', '#ffd166', '#ff2d95', '#7c4dff', '#38d9ff', '#7dff84']
    fade-colors: ['#ffffff', '#fff3c4']
  scenes:
    # OPEN switches from ambient to countdown at this many seconds remaining.
    countdown-threshold-seconds: 5
    ambient:
      enabled: true
      interval-seconds: 1
      particle-count: 160
      radius: 2.6
      firework-interval-seconds: 6
    countdown:
      enabled: true
      interval-seconds: 1
      particle-count: 320
      radius: 3.6
      firework-interval-seconds: 1
    drawing:
      enabled: true
      interval-seconds: 1
      particle-count: 480
      radius: 4.4
      firework-interval-seconds: 1
    winner:
      enabled: true
      particle-count: 1000
      radius: 6.0
      firework-count: 18
      firework-interval-ticks: 3

locale:
  default: ru
  # RusCrafting is a Russian-language network; keep the complete surface coherent.
  use-client-locale: false
