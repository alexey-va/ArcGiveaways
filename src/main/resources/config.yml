server-id: spawn

giveaway:
  radius-blocks: 100.0
  open-seconds: 45
  drawing-seconds: 6
  minimum-participants: 1
  maximum-participants: 250
  maximum-item-amount: 64
  host-cooldown-seconds: 0
  terminal-retention-minutes: 30

cross-server:
  enabled: true
  transfer-on-click: true
  pending-join-seconds: 45
  host-handoff-seconds: 45
  presence-heartbeat-seconds: 5
  presence-lease-seconds: 20
  allowed-origins: [spawn, survival, parkour]

redis:
  import-arc-credentials: true

effects:
  bossbar: true
  actionbar: true
  titles: true
  sounds: true
  particles: true
  fireworks: true

locale:
  default: ru
  # RusCrafting is a Russian-language network; keep the complete surface coherent.
  use-client-locale: false
