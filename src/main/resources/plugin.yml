name: ArcGiveaways
version: '${version}'
main: ru.ruscrafting.giveaways.paper.ArcGiveawaysPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Cross-server proximity giveaways
softdepend: [ARC, LuckPerms]
commands:
  giveaway:
    description: Player giveaways
    aliases: [giveaways, razdacha]
    usage: /giveaway
permissions:
  arcgiveaways.use:
    default: true
  arcgiveaways.start:
    default: false
  arcgiveaways.admin:
    default: op
